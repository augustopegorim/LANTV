<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANTV</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #info { position: fixed; left: 1rem; bottom: 1rem; color: #fff; font: 16px sans-serif;
          background: rgba(0,0,0,.6); padding: .4rem .7rem; border-radius: .3rem; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<script src="/web/hls.min.js"></script>
<script>
  // Página de teste da fase 0: toca o canal e reconecta sozinha se cair.
  const url = "/canal/canal.m3u8";
  const v = document.getElementById('v');
  let erros = 0;

  function iniciar() {
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ liveSyncDurationCount: 3, manifestLoadingMaxRetry: Infinity });
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        erros++;
        setTimeout(() => { hls.destroy(); iniciar(); }, 3000);
      });
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url;
      v.onerror = () => { erros++; setTimeout(() => { v.src = url; v.play(); }, 3000); };
    } else {
      document.body.textContent = 'este navegador não toca HLS';
      return;
    }
    v.play().catch(() => {});
  }

  // Som só depois de um clique/OK no controle (regra dos navegadores).
  document.addEventListener('click', () => { v.muted = false; });
  document.addEventListener('keydown', () => { v.muted = false; });

  iniciar();
</script>
</body>
</html>
